$schema: "https://json-schema.org/draft/2020-12/schema"
title: Factor Library Document
type: object
additionalProperties: true
required:
  - name
  - code
  - formula_type
  - category
  - description
properties:
  name:
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9_]*$"
  code:
    type: string
    minLength: 1
    description: "An arithmetic expression for formula_type=expression, or Python source for formula_type=python."
  formula_type:
    type: string
    enum:
      - expression
      - python
  category:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  metadata:
    type: object
    additionalProperties: true

